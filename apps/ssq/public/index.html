<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e1a1a" />
    <meta name="description" content="SSQ Questionnaire - Simulator Sickness Questionnaire for measuring motion sickness symptoms in virtual environments" />
    <meta name="keywords" content="SSQ, simulator sickness, motion sickness, questionnaire, VR, virtual reality, research, psychology" />
    <meta name="author" content="Mohammad Raihanul Bashar" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://your-domain.com/" />
    <meta property="og:title" content="SSQ Questionnaire" />
    <meta property="og:description" content="Simulator Sickness Questionnaire for measuring motion sickness symptoms in virtual environments" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://your-domain.com/" />
    <meta property="twitter:title" content="SSQ Questionnaire" />
    <meta property="twitter:description" content="Simulator Sickness Questionnaire for measuring motion sickness symptoms in virtual environments" />

    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Preload critical fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>SSQ Questionnaire - Simulator Sickness Research Tool</title>

    <style>
      /* Loading screen styles */
      .loading-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #2e1a1a, #3e1616);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }

      .loading-spinner {
        width: 50px;
        height: 50px;
        border: 3px solid rgba(246, 100, 100, 0.3);
        border-top: 3px solid #f66464;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .loading-text {
        margin-top: 20px;
        color: #f66464;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 1.1rem;
        font-weight: 500;
      }

      .loading-subtitle {
        margin-top: 10px;
        color: #e0e0e0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        font-size: 0.9rem;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <noscript>
      <div style="
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #2e1a1a;
        color: #e0e0e0;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        padding: 20px;
        box-sizing: border-box;
      ">
        <h1 style="color: #f66464; margin-bottom: 20px;">JavaScript Required</h1>
        <p style="font-size: 1.1rem; line-height: 1.6; max-width: 500px;">
          You need to enable JavaScript to run the SSQ Questionnaire app.
          This research tool requires JavaScript for symptom rating and scoring calculations.
        </p>
        <p style="margin-top: 20px; font-size: 0.9rem; color: #b0b0b0;">
          Please enable JavaScript in your browser settings and refresh the page.
        </p>
      </div>
    </noscript>

    <!-- Loading screen (will be hidden when React loads) -->
    <div id="loading-screen" class="loading-screen">
      <div style="text-align: center;">
        <div class="loading-spinner"></div>
        <div class="loading-text">Loading SSQ Questionnaire...</div>
        <div class="loading-subtitle">Simulator Sickness Assessment Tool</div>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Hide loading screen when React app loads
      window.addEventListener('load', function() {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          setTimeout(() => {
            loadingScreen.style.opacity = '0';
            setTimeout(() => {
              loadingScreen.style.display = 'none';
            }, 500);
          }, 1000);
        }
      });

      // Hide loading screen if it takes too long (fallback)
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        if (loadingScreen) {
          loadingScreen.style.display = 'none';
        }
      }, 5000);

      // Initialize SSQ session tracking
      if (!sessionStorage.getItem('ssqSessionStart')) {
        sessionStorage.setItem('ssqSessionStart', Date.now());
      }
    </script>
  </body>
</html>
